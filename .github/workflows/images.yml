# Builds the two container images and pushes them to GitHub's registry:
#   ghcr.io/savovuksan/steam-sale-notifier   notifier.py + availability.py (one-shot jobs)
#   ghcr.io/savovuksan/steam-sale-webui      the web UI (Flask)
# Tags: :latest and :sha-<commit> only from main (the server auto-updates from
# :latest); pull requests and other branches only build, to catch errors.
# The packages must be PUBLIC (GitHub -> Packages -> settings) so the server can
# pull without a token.
name: images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {image: steam-sale-notifier, dockerfile: Dockerfile}
          - {image: steam-sale-webui, dockerfile: Dockerfile.webui}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push from main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/savovuksan/${{ matrix.image }}:latest
            ghcr.io/savovuksan/${{ matrix.image }}:sha-${{ github.sha }}
          # Links the package to this repo on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
